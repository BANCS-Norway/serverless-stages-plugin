name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The relevant section of your `serverless.yml` and the command you ran.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      render: shell

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: serverless-version
    attributes:
      label: Serverless Framework version
      placeholder: e.g. 4.1.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 22.3.0
    validations:
      required: true
